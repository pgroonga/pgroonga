name: Release
on:
  push:
    tags:
      - "*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
jobs:
  github:
    name: GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: "pgroonga/pgroonga.github.io"
          path: "pgroonga.github.io"
      - name: Download artifacts
        if: |
          github.ref_type == 'tag'
        run: |
          workflows=(package.yml windows.yml)
          for workflow in "${workflows[@]}"; do
            run_id=""
            while true; do
              echo "Waiting for run to start ${workflow}..."
              run_id=$(gh run list \
                         --branch ${GITHUB_REF_NAME} \
                         --jq '.[].databaseId' \
                         --json databaseId \
                         --limit 1 \
                         --workflow ${workflow})
              if [ -n "${run_id}" ]; then
                break
              fi
              sleep 300
            done
            gh run watch \
              --exit-status \
              --interval 300 \
              ${run_id}
            gh run download ${run_id} \
              --dir release-artifacts \
              --pattern "release-*"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Extract release note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby \
            -e 'print("## PGroonga "); \
                puts(ARGF.read.split(/^## /)[1]. \
                       gsub(/ {.+?}/, ""). \
                       gsub(/\[(.+?)\]\[.+?\]/) {$1})' \
            pgroonga.github.io/news/index.md | tee release-note.md

          previous_tag=$(gh release list \
                           --jq '.[].tagName' \
                           --json tagName \
                           --limit 1)

          echo "### Contributors" | tee -a release-note.md
          echo | tee -a release-note.md
          command_line="git shortlog -sn ${previous_tag}.."
          echo '```console' | tee -a release-note.md
          echo "\$ ${command_line}" | tee -a release-note.md
          ${command_line} | tee -a release-note.md
          echo '```' | tee -a release-note.md
      - name: Publish
        if: |
          github.ref_type == 'tag'
        run: |
          title=$(head -n1 release-note.md | sed -e 's/^## //')
          tail -n +2 release-note.md > release-note-without-version.md
          gh release create ${GITHUB_REF_NAME} \
            --discussion-category Releases \
            --notes-file release-note-without-version.md \
            --title "${title}" \
            release-artifacts/*/*
        env:
          GH_TOKEN: ${{ github.token }}
  launchpad:
    name: Launchpad
    if: |
      github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: github
    environment: release
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with packages/*/Rakefile:ubuntu_targets_default
        include:
          - package: postgresql-14-pgroonga
            code-name: jammy
          - package: postgresql-16-pgroonga
            code-name: noble
          - package: postgresql-18-pgroonga
            code-name: resolute
    steps:
      - uses: actions/checkout@v7
      - name: Download source archive
        run: |
          wget \
            https://github.com/pgroonga/pgroonga/releases/download/${GITHUB_REF_NAME}/pgroonga-${GITHUB_REF_NAME}.tar.gz
      - name: Prepare
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            debhelper \
            devscripts
      - uses: actions/checkout@v7
        with:
          path: groonga
          repository: groonga/groonga
      - uses: actions/checkout@v7
        with:
          path: apache-arrow
          repository: apache/arrow
      - name: Publish
        env:
          APACHE_ARROW_REPOSITORY: ${{ github.workspace }}/apache-arrow
          GH_TOKEN: ${{ github.token }}
          GROONGA_REPOSITORY: ${{ github.workspace }}/groonga
          LAUNCHPAD_DEPLOY_KEY: ${{ secrets.LAUNCHPAD_DEPLOY_KEY }}
          LAUNCHPAD_UPLOADER_PGP_KEY: "0x32862FBCD63D72C152EFF3A9BD481CAA9168EA87"
        run: |
          echo "${LAUNCHPAD_DEPLOY_KEY}" | gpg --import
          echo "trusted-key ${LAUNCHPAD_UPLOADER_PGP_KEY}" > ~/.gnupg/gpg.conf
          rake -C packages/${{ matrix.package }} \
            ubuntu:upload:${{ matrix.code-name }}
